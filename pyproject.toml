[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nina"
version = "0.1.0"
description = "Voice-Based Emotion Detection Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nina Engineering Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
# Audio Input Support
audio = [
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
]

# Machine Learning Core (Inference engines)
ml = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "faster-whisper>=1.0.0",
    "scikit-learn>=1.3.0",
]

# API Server Support
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

# Development & Testing Quality Suite
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "black>=23.11.0",
]

# Benchmarking & Evaluation
eval = [
    "jiwer>=3.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
]

[project.scripts]
nina = "nina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=nina"
testpaths = ["tests"]
pythonpath = ["src"]
